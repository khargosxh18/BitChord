name: Check Keystore

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Verify keystore secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
        done
        echo "$KEYSTORE_BASE64" | base64 -d > ks.jks
        ls -l ks.jks
        echo "Aliases inside the keystore:"
        keytool -list -keystore ks.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "PrivateKeyEntry" || true
        keytool -list -keystore ks.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
        keytool -keypasswd -keystore ks.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -new "$KEY_PASSWORD" > /dev/null
        echo "OK: store password, alias and key password all work"
