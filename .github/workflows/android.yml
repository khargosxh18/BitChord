name: Android Dev APK

on:
  workflow_dispatch:

jobs:
  build-dev-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build optimized (R8) APK
      run: ./gradlew :app:assembleDevBenchmark -Pbitchord.bundleWear=false -Pandroid.injected.build.abi=arm64-v8a -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" --no-daemon

    - name: List built APKs
      run: find app/build -name "*.apk" -exec ls -lh {} \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-optimized
        path: |
          app/build/intermediates/apk/dev/benchmark/*.apk
          app/build/outputs/apk/dev/benchmark/*.apk
        if-no-files-found: error
